# Publishes the static site to GitHub Pages (gh-pages branch).
# The backend loads the committed real-data snapshot, brings it up to date from ESPN (scores,
# DraftKings lines, box scores, injuries, rosters), trains the models, runs the walk-forward
# backtest, archives forecasts for upcoming games and renders every API response the web app
# needs to JSON; the frontend is then built as a static site. Live scores are refreshed in the
# browser between builds.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */2 * * *"   # every two hours: new results, lines, injuries and forecasts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ENABLE_SCHEDULER: "false"
      DATA_SOURCE: espn
      BASE: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Restore ESPN response cache
        uses: actions/cache@v4
        with:
          path: backend/data/espn_cache
          key: espn-cache-${{ github.run_id }}
          restore-keys: espn-cache-
      - name: Restore the live forecast ledger
        run: |
          mkdir -p backend/data/ledger
          if git fetch -q origin ledger 2>/dev/null; then
            git show FETCH_HEAD:live_predictions.jsonl.gz > backend/data/ledger/live_predictions.jsonl.gz || rm -f backend/data/ledger/live_predictions.jsonl.gz
          fi
          ls -la backend/data/ledger
      - name: Prepare data and models
        working-directory: backend
        run: python -m app.cli bootstrap
      - name: Save the live forecast ledger
        working-directory: backend
        run: python -m app.cli export-ledger
      - name: Push the ledger branch
        run: |
          WORK="$(mktemp -d)"; cd "$WORK"
          git init -q -b ledger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q "$REMOTE" ledger 2>/dev/null; then git checkout -q -B ledger FETCH_HEAD; fi
          cp "$GITHUB_WORKSPACE/backend/data/ledger/live_predictions.jsonl.gz" .
          printf '%s\n' "# COURTSIDE IQ live forecast ledger" "" \
            "Append-only record of forecasts frozen in real time before tip-off (one JSON object per line, gzipped)." \
            "Each commit is written by the Pages workflow; the history shows when every forecast existed." > README.md
          git add -A
          git diff --cached --quiet || git commit -q -m "Ledger update ${GITHUB_SHA::7} $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q "$REMOTE" ledger
      - name: Export API responses
        working-directory: backend
        run: python -m app.cli export-static --out ../frontend/public/data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build static site
        working-directory: frontend
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_STATIC: "1"
          NEXT_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          export BASE_PATH="$BASE" NEXT_PUBLIC_BASE_PATH="$BASE"
          npm ci
          cp ../backend/data/ledger/live_predictions.jsonl.gz public/data/ || true
          npm run build
          touch out/.nojekyll
      - name: Browser tests (desktop, tablet, mobile)
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          BASE_PATH="$BASE" CI=1 npx playwright test
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Publish to the gh-pages branch
        working-directory: frontend/out
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Preview build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
