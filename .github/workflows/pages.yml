# Publishes the static site to GitHub Pages (gh-pages branch).
# The backend loads the committed real-data snapshot, brings it up to date from ESPN (scores,
# DraftKings lines, box scores, injuries, rosters), trains the models, runs the walk-forward
# backtest, archives forecasts for upcoming games and renders every API response the web app
# needs to JSON; the frontend is then built as a static site. Live scores are refreshed in the
# browser between builds.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */2 * * *"   # every two hours: new results, lines, injuries and forecasts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ENABLE_SCHEDULER: "false"
      DATA_SOURCE: espn
      BASE: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Restore ESPN response cache
        uses: actions/cache@v4
        with:
          path: backend/data/espn_cache
          key: espn-cache-${{ github.run_id }}
          restore-keys: espn-cache-
      - name: Prepare data and models
        working-directory: backend
        run: python -m app.cli bootstrap
      - name: Export API responses
        working-directory: backend
        run: python -m app.cli export-static --out ../frontend/public/data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build static site
        working-directory: frontend
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_STATIC: "1"
          NEXT_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          export BASE_PATH="$BASE" NEXT_PUBLIC_BASE_PATH="$BASE"
          npm ci
          npm run build
          touch out/.nojekyll
      - name: Publish to the gh-pages branch
        working-directory: frontend/out
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Preview build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
