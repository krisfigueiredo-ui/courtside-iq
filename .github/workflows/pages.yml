# Publishes a read-only static preview of the application to GitHub Pages (gh-pages branch).
# The backend loads the committed demo dataset, trains the models, and renders every API
# response the web app needs to JSON; the frontend is then built as a static site.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"   # daily rebuild so the demo slate and results stay current
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ENABLE_SCHEDULER: "false"
      BASE: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Prepare data and models
        working-directory: backend
        run: python -m app.cli bootstrap
      - name: Export API responses
        working-directory: backend
        run: python -m app.cli export-static --out ../frontend/public/data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build static site
        working-directory: frontend
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_STATIC: "1"
          NEXT_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          export BASE_PATH="$BASE" NEXT_PUBLIC_BASE_PATH="$BASE"
          npm ci
          npm run build
          touch out/.nojekyll
      - name: Publish to the gh-pages branch
        working-directory: frontend/out
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Preview build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
